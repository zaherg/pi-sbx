# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: pi (subscriptions, v3)
description: >-
  pi coding agent with Claude and ChatGPT subscriptions plus OpenRouter,
  all proxy-managed.
dockerfile: ./pi-sub.dockerfile

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - registry.npmjs.org
          - nodejs.org
          - github.com
          - raw.githubusercontent.com
          - pypi.org
          - files.pythonhosted.org
          - api.openai.com
          - auth.openai.com
          - chatgpt.com
          - "*.chatgpt.com"
          - "*.oaiusercontent.com"
          - files.openai.com
          - executor.mac.srvr.dev
          - firecrawl.nanosite.app
          - search.mac.srvr.dev
          - api.search.brave.com
          - openrouter.ai
          - api.typesafe.ai

  - type: com.docker.sandbox/credential@1
    optional: true
    description: ChatGPT subscription (OAuth)
    config:
      service: openai
      phase: runtime
      oauth:
        tokenEndpoint:
          host: auth.openai.com
          path: /oauth/token
        resourceHosts:
          - chatgpt.com
        sentinels:
          # JWT-shaped because pi decodes the account id before requests.
          # The proxy replaces this dummy credential on chatgpt.com.
          accessToken: "IHsiYWxnIjoibm9uZSIsInR5cCI6IkpXVCJ9.\
            ICB7Imh0dHBzOi8vYXBpLm9wZW5haS5jb20v\
            YXV0aCI6eyJjaGF0Z3B0X2FjY291\
            bnRfaWQiOiJwcm94eS1tYW5hZ2VkIn19.oai-oat01-proxy-managed"
          refreshToken: oai-ort01-proxy-managed
        credentialFile:
          path: ~/.pi/agent/auth.json
          structure:
            openai-codex:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              # Freshness stays on the host; sandbox refresh is not
              # intercepted by sbx 0.51 and fails with invalid_client.
              expires: 4102444800000

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API key
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - domain: openrouter.ai
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/resources@1
    config:
      cpu: 4
      memory: 2g
      # Preserved from v2. Docker documents that sbx ignores this field.
      gpu: "1"

  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Hook environments are deny-by-default, so declare both proxy
        # variables read by this command and by npm.
        - command: >-
            if [ -n "${HTTP_PROXY:-}" ]; then npm config set
            proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}";
            fi
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Point npm at the sandbox proxy in ~/.npmrc
